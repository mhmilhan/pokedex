name: Periodic Health Check

on:
  schedule:
    - cron: '0 12 * * *'
  push:
    branches:
      - main

jobs:
  periodic_health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://pokedex-i2iu.onrender.com/health
          follow-redirect: false
          max-attempts: 3 
          retry-delay: 5s

      - name: Health Check done successfully
        if: success()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{"content": "Health Check Done Successfully"}'

      - name: Health Check Failure Notification
        if: failure()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d '{"content": "**Health Check Failed!** The Pokedex app might be down."}'